<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06080F"/>
      <stop offset="100%" style="stop-color:#0C0F1E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#06B6D4"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="630" rx="0" ry="0"/>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Glow décoratif -->
  <ellipse cx="300" cy="250" rx="400" ry="300" fill="url(#glowGrad)" filter="url(#blur)"/>
  <ellipse cx="950" cy="450" rx="300" ry="200" fill="#06B6D4" opacity="0.08" filter="url(#blur)"/>

  <!-- Ligne accent gauche -->
  <rect x="80" y="160" width="4" height="310" fill="url(#accentGrad)" rx="2"/>

  <!-- Initiales DM — grand format -->
  <text x="900" y="420" font-family="Georgia, serif" font-size="320" font-weight="700"
        fill="#FFFFFF" opacity="0.04" text-anchor="middle" letter-spacing="-10">DM</text>

  <!-- Bloc texte principal -->
  <text x="120" y="240"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="22"
        font-weight="400"
        fill="#A78BFA"
        letter-spacing="5">
    PORTFOLIO — 2026
  </text>

  <text x="115" y="330"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="82"
        font-weight="700"
        fill="#F8FAFC"
        letter-spacing="-2">
    Demba Mbow
  </text>

  <!-- Ligne gradient sous le nom -->
  <rect x="115" y="348" width="480" height="3" fill="url(#accentGrad)" rx="2"/>

  <text x="117" y="410"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="34"
        font-weight="300"
        fill="#CBD5E1"
        letter-spacing="1">
    Créateur Digital · UI/UX Designer · Web Stratège
  </text>

  <!-- Tags -->
  <!-- Tag 1 -->
  <rect x="115" y="450" width="160" height="42" rx="21" fill="#7C3AED" opacity="0.25"/>
  <rect x="115" y="450" width="160" height="42" rx="21" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.6"/>
  <text x="195" y="477" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16"
        fill="#A78BFA" text-anchor="middle" font-weight="500">Web Design</text>

  <!-- Tag 2 -->
  <rect x="290" y="450" width="150" height="42" rx="21" fill="#06B6D4" opacity="0.15"/>
  <rect x="290" y="450" width="150" height="42" rx="21" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
  <text x="365" y="477" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16"
        fill="#67E8F9" text-anchor="middle" font-weight="500">UI/UX Design</text>

  <!-- Tag 3 -->
  <rect x="458" y="450" width="160" height="42" rx="21" fill="#F97316" opacity="0.15"/>
  <rect x="458" y="450" width="160" height="42" rx="21" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.4"/>
  <text x="538" y="477" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16"
        fill="#FDBA74" text-anchor="middle" font-weight="500">Branding</text>

  <!-- URL en bas -->
  <text x="115" y="570"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20"
        font-weight="400"
        fill="#64748B"
        letter-spacing="2">
    dembambow.com
  </text>

  <!-- Point décoratif violet -->
  <circle cx="1100" cy="120" r="80" fill="#7C3AED" opacity="0.12"/>
  <circle cx="1100" cy="120" r="50" fill="#7C3AED" opacity="0.12"/>
  <circle cx="1100" cy="120" r="20" fill="#7C3AED" opacity="0.3"/>
</svg>
